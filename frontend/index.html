                                    </label>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-ghost" onClick={() => setShowAdd(false)}>Cancel</button>
                                    <button className="btn btn-primary" onClick={saveDefinition} disabled={saving}>
                                        {saving ? "Saving…" : "Save definition"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ── HITL QUEUE PANEL ─────────────────────────────────────────────
        function HitlPanel({ refreshKey, onResolved }) {
            const [conflicts, setConflicts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [merging, setMerging] = useState({});
            const [mergeText, setMergeText] = useState({});
            const [resolving, setResolving] = useState({});

            async function load() {
                setLoading(true);
                try {
                    const d = await apiFetch("/api/hitl/queue");
                    setConflicts(d.conflicts || []);
                } catch (e) { toast(e.message, "red"); }
                finally { setLoading(false); }
            }

            useEffect(() => { load(); }, [refreshKey]);

            async function resolve(id, action) {
                setResolving(p => ({ ...p, [id]: true }));
                try {
                    await apiFetch("/api/hitl/resolve", {
                        method: "POST", body: JSON.stringify({
                            conflict_id: id, action,
                            merged_definition: action === "merge" ? mergeText[id] : undefined
                        })
                    });
                    toast(`Resolved: ${action}`, "green");
                    setConflicts(p => p.filter(c => c.id !== id));
                    onResolved && onResolved();
                } catch (e) { toast(e.message, "red"); }
                finally { setResolving(p => ({ ...p, [id]: false })); }
            }

            const simColor = (s) => {
                const p = Math.round((s || 0) * 100);
                return p >= 90 ? "high" : "med";
            };

            return (
                <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
                    <div className="panel-header">
                        <div>
                            <div className="panel-title">HITL Queue</div>
                            <div className="panel-sub">Human-in-the-loop conflict resolution</div>
                        </div>
                        <div className="panel-actions">
                            <button className="btn btn-ghost btn-sm" onClick={load}>↻ Refresh</button>
                        </div>
                    </div>
                    <div className="panel-body">
                        {loading ? (
                            <div className="empty-state"><div className="skel" style={{ width: 200, height: 12 }} /></div>
                        ) : conflicts.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">✅</div>
                                <div className="empty-title">No pending conflicts</div>
                                <div className="empty-sub">All metric definitions are consistent. The queue will fill when ambiguous queries are detected.</div>
                            </div>
                        ) : (
                            conflicts.map(c => (
                                <div key={c.id} className="hitl-card">
                                    <div className="hitl-head">
                                        <span style={{ fontSize: 12, fontWeight: 600, color: "var(--yellow)" }}>⚠️ Conflict</span>
                                        <span style={{ fontSize: 10, color: "var(--text3)", fontFamily: "monospace" }}>{c.id.slice(0, 8)}</span>
                                        <div className={`hitl-sim ${simColor(c.similarity)}`}>
                                            {Math.round((c.similarity || 0) * 100)}% match
                                        </div>
                                    </div>

                                    <div className="sim-bar-wrap">
                                        <div className="sim-bar" style={{
                                            width: `${Math.round((c.similarity || 0) * 100)}%`,
                                            background: (c.similarity || 0) >= 0.9 ? "var(--red)" : "var(--yellow)"
                                        }} />
                                    </div>

                                    <div style={{ marginBottom: 6 }}>
                                        <div className="hitl-label">Incoming question</div>
                                        <div className="hitl-q">{c.question_a}</div>
                                    </div>

                                    <div style={{ marginBottom: 6 }}>
                                        <div className="hitl-label">Matches definition: <strong style={{ color: "var(--accent2)" }}>{c.def_b}</strong></div>
                                        <div className="hitl-q" style={{ fontSize: 11, color: "var(--text2)" }}>{c.question_b}</div>
                                    </div>

                                    <div style={{ fontSize: 10, color: "var(--text3)", marginBottom: 8 }}>
                                        {fmtDate(c.created_at)} · {fmt(c.created_at)}
                                    </div>

                                    {merging[c.id] && (
                                        <div style={{ marginBottom: 8 }}>
                                            <div className="hitl-label">Merged definition text</div>
                                            <textarea
                                                className="input textarea"
                                                style={{ fontSize: 12 }}
                                                value={mergeText[c.id] || ""}
                                                onChange={e => setMergeText(p => ({ ...p, [c.id]: e.target.value }))}
                                                placeholder="Write the canonical merged definition…"
                                            />
                                        </div>
                                    )}

                                    <div className="hitl-actions">
                                        <button className="btn btn-green btn-sm"
                                            onClick={() => resolve(c.id, "approve_b")}
                                            disabled={resolving[c.id]}>
                                            ✓ Keep existing
                                        </button>
                                        <button className="btn btn-yellow btn-sm"
                                            onClick={() => setMerging(p => ({ ...p, [c.id]: !p[c.id] }))}>
                                            {merging[c.id] ? "Cancel" : "Merge"}
                                        </button>
                                        {merging[c.id] && (
                                            <button className="btn btn-primary btn-sm"
                                                onClick={() => resolve(c.id, "merge")}
                                                disabled={!mergeText[c.id] || resolving[c.id]}>
                                                Save merge
                                            </button>
                                        )}
                                        <button className="btn btn-ghost btn-sm"
                                            onClick={() => resolve(c.id, "approve_a")}
                                            disabled={resolving[c.id]}>
                                            Create new
                                        </button>
                                        <button className="btn btn-red btn-sm"
                                            onClick={() => resolve(c.id, "reject")}
                                            disabled={resolving[c.id]}>
                                            Reject
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // ── DRIFT PANEL ───────────────────────────────────────────────────
        function DriftPanel({ refreshKey }) {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [watching, setWatching] = useState(false);

            async function load() {
                setLoading(true);
                try {
                    const d = await apiFetch("/api/drift");
                    setEvents(d.events || []);
                } catch (e) { }
                finally { setLoading(false); }
            }

            useEffect(() => { load(); }, [refreshKey]);

            async function triggerWatch() {
                setWatching(true);
                try {
                    const d = await apiFetch("/api/drift/watch", { method: "POST" });
                    toast(`Drift check: ${d.events_detected} event(s)`, d.events_detected > 0 ? "yellow" : "green");
                    load();
                } catch (e) { toast(e.message, "red"); }
                finally { setWatching(false); }
            }

            return (
                <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
                    <div className="panel-header">
                        <div>
                            <div className="panel-title">Schema Drift</div>
                            <div className="panel-sub">Column-level change detection</div>
                        </div>
                        <div className="panel-actions">
                            <button className="btn btn-ghost btn-sm" onClick={triggerWatch} disabled={watching}>
                                {watching ? "Checking…" : "Run check"}
                            </button>
                        </div>
                    </div>
                    <div className="panel-body">
                        {loading ? (
                            <div className="empty-state"><div className="skel" style={{ width: 200, height: 12 }} /></div>
                        ) : events.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">🔍</div>
                                <div className="empty-title">No drift events</div>
                                <div className="empty-sub">All schema snapshots match. Run a check to detect new column changes.</div>
                                <button className="btn btn-ghost btn-sm" onClick={triggerWatch}>Run schema check</button>
                            </div>
                        ) : (
                            events.map((e, i) => (
                                <div key={i} className={`drift-card ${e.type === "column_removed" ? "drift-removed" : ""}`}>
                                    <div className="drift-head">
                                        {e.type === "column_added" ? "➕" : "➖"} {e.type === "column_added" ? "Column Added" : "Column Removed"}
                                        <span className={`badge ${e.type === "column_added" ? "badge-blue" : "badge-red"}`} style={{ marginLeft: "auto" }}>
                                            {e.type}
                                        </span>
                                    </div>
                                    <div className="drift-detail">
                                        Table: <strong>{e.table}</strong> · Column: <strong style={{ fontFamily: "monospace" }}>{e.column}</strong>
                                    </div>
                                    <div className="drift-detail" style={{ marginTop: 4 }}>{e.detail}</div>
                                    {e.affected_definitions && JSON.parse(e.affected_definitions || "[]").length > 0 && (
                                        <div className="drift-affects">
                                            ⚠ Breaks definitions: {JSON.parse(e.affected_definitions).join(", ")}
                                        </div>
                                    )}
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // ── STATS PANEL ───────────────────────────────────────────────────
        function StatsPanel({ refreshKey }) {
            const [stats, setStats] = useState(null);

            async function load() {
                try { setStats(await apiFetch("/api/stats")); } catch (e) { }
            }

            useEffect(() => { load(); }, [refreshKey]);
            useEffect(() => { const t = setInterval(load, 10000); return () => clearInterval(t); }, []);

            if (!stats) return (
                <div className="panel-body" style={{ padding: 16 }}>
                    <div className="stats-grid">
                        {[1, 2, 3, 4].map(i => (
                            <div key={i} className="stat-card"><div className="skel" style={{ height: 28, width: 60, marginBottom: 6 }} /><div className="skel" style={{ height: 10, width: 80 }} /></div>
                        ))}
                    </div>
                </div>
            );

            const statCards = [
                { val: stats.definitions?.approved || 0, label: "Approved Defs", sub: `${stats.definitions?.pending || 0} pending`, color: "var(--green)" },
                { val: stats.hitl?.pending || 0, label: "HITL Queue", sub: "conflicts pending", color: stats.hitl?.pending > 0 ? "var(--yellow)" : "var(--text)" },
                { val: stats.queries?.total || 0, label: "Total Queries", sub: `avg ${stats.queries?.avg_latency_ms || 0}ms`, color: "var(--blue)" },
                { val: stats.drift?.unnotified || 0, label: "Drift Events", sub: "unnotified", color: stats.drift?.unnotified > 0 ? "var(--yellow)" : "var(--text)" },
            ];

            const llmUsage = stats.llm_usage?.today || {};
            const llmLimits = stats.llm_usage?.limits || {};
            const totalTokens = stats.llm_usage?.total_tokens || 0;
            const cacheHits = stats.embedding_cache?.total_cached || 0;

            return (
                <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
                    <div className="panel-header">
                        <div className="panel-title">System Stats</div>
                        <button className="btn btn-ghost btn-sm" onClick={load}>↻</button>
                    </div>
                    <div className="panel-body">
                        <div className="stats-grid" style={{ marginBottom: 12 }}>
                            {statCards.map(s => (
                                <div key={s.label} className="stat-card">
                                    <div className="stat-val" style={{ color: s.color }}>{s.val}</div>
                                    <div className="stat-label">{s.label}</div>
                                    <div className="stat-sub">{s.sub}</div>
                                </div>
                            ))}
                        </div>

                        <div className="card" style={{ marginBottom: 10 }}>
                            <div className="card-header">
                                <span className="card-title">LLM Usage Today</span>
                                <span className="badge badge-green">Free tier</span>
                            </div>
                            {Object.entries(llmUsage).length === 0 ? (
                                <div style={{ fontSize: 12, color: "var(--text3)" }}>No calls yet today</div>
                            ) : (
                                Object.entries(llmUsage).map(([prov, calls]) => (
                                    <div key={prov} className="usage-row">
                                        <span style={{ fontSize: 12, width: 80, fontFamily: "monospace", flexShrink: 0 }}>{prov}</span>
                                        <div className="usage-bar-wrap">
                                            <div className="usage-bar" style={{
                                                width: `${Math.min(100, (calls / (llmLimits[prov] || 1000)) * 100)}%`,
                                                background: "var(--accent)"
                                            }} />
                                        </div>
                                        <span style={{ fontSize: 11, color: "var(--text2)", flexShrink: 0, width: 60, textAlign: "right" }}>
                                            {calls}/{llmLimits[prov] || "∞"}
                                        </span>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="card">
                            <div className="card-header"><span className="card-title">Cache</span></div>
                            <div style={{ fontSize: 12, color: "var(--text2)" }}>
                                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                                    <span>Embedding cache hits</span>
                                    <strong style={{ color: "var(--green)" }}>{cacheHits}</strong>
                                </div>
                                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                                    <span>Total tokens (all time)</span>
                                    <strong>{(totalTokens / 1000).toFixed(1)}K</strong>
                                </div>
                                <div style={{ display: "flex", justifyContent: "space-between" }}>
                                    <span>Data DB size</span>
                                    <strong>{stats.data_db?.size_mb || 0} MB</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ── HISTORY PANEL ─────────────────────────────────────────────────
        function HistoryPanel({ refreshKey }) {
            const [rows, setRows] = useState([]);
            const [loading, setLoading] = useState(true);
            const [myOnly, setMyOnly] = useState(true);
            const [expanded, setExpanded] = useState(null);

            async function load() {
                setLoading(true);
                try {
                    const params = myOnly ? `?session_id=${SESSION_ID}&limit=50` : "?limit=50";
                    const d = await apiFetch("/api/history" + params);
                    setRows(d.history || []);
                } catch (e) { }
                finally { setLoading(false); }
            }

            useEffect(() => { load(); }, [refreshKey, myOnly]);

            const statusColor = (s) => s === "ok" ? "green" : s === "conflict_detected" ? "yellow" : "red";

            return (
                <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden" }}>
                    <div className="panel-header">
                        <div>
                            <div className="panel-title">Query History</div>
                            <div className="panel-sub">{rows.length} queries</div>
                        </div>
                        <div className="panel-actions">
                            <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "var(--text2)", cursor: "pointer" }}>
                                <input type="checkbox" checked={myOnly} onChange={e => setMyOnly(e.target.checked)}
                                    style={{ accentColor: "var(--accent)" }} />
                                My session
                            </label>
                            <button className="btn btn-ghost btn-sm" onClick={load}>↻</button>
                        </div>
                    </div>
                    <div className="panel-body">
                        {loading ? (
                            [1, 2, 3].map(i => <div key={i} className="skel" style={{ height: 44, borderRadius: 8 }} />)
                        ) : rows.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">📜</div>
                                <div className="empty-title">No history yet</div>
                                <div className="empty-sub">Queries will appear here after you ask something in the chat.</div>
                            </div>
                        ) : (
                            rows.map(r => {
                                const sr = typeof r.sql_result === "string" ? JSON.parse(r.sql_result || "{}") : r.sql_result || {};
                                const isExp = expanded === r.id;
                                return (
                                    <div key={r.id} style={{ cursor: "pointer" }} onClick={() => setExpanded(p => p === r.id ? null : r.id)}>
                                        <div className="history-row" style={{ flexDirection: "column", alignItems: "flex-start", gap: 4 }}>
                                            <div style={{ display: "flex", alignItems: "center", gap: 8, width: "100%" }}>
                                                <span className={`badge badge-${statusColor(r.status)}`} style={{ flexShrink: 0 }}>
                                                    {r.status === "ok" ? "✓" : r.status === "conflict_detected" ? "⚠" : "✕"}
                                                </span>
                                                <span className="history-q">{r.question}</span>
                                                <span className="history-meta">{r.latency_ms}ms</span>
                                            </div>
                                            <div style={{ display: "flex", gap: 6, alignItems: "center", paddingLeft: 4 }}>
                                                {r.provider && <span className="provider-chip">{r.provider}</span>}
                                                <span style={{ fontSize: 10, color: "var(--text3)" }}>{fmtDate(r.created_at)} {fmt(r.created_at)}</span>
                                            </div>
                                        </div>
                                        {isExp && sr?.sql && (
                                            <div style={{
                                                background: "var(--bg)", padding: "8px 12px", marginTop: 2, borderRadius: 6,
                                                fontFamily: "monospace", fontSize: 11, color: "#79c0ff", border: "1px solid var(--border)"
                                            }}>
                                                {sr.sql}
                                            </div>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

            return (

                    <div className="panel-header">
                        <div className="panel-title">Settings</div>
                    </div>
                    <div className="panel-body">
                        <div className="card">
                            <div className="card-header"><span className="card-title">API Token</span></div>
                            <div className="field">
                                <label className="label">Admin token (X-API-Key)</label>
                                <input className="input" type="password" value={token} onChange={e => setToken(e.target.value)}
                                    placeholder="dd-dev-token-change-in-prod" />
                            </div>
                            <button className="btn btn-primary btn-sm" onClick={save}>{saved ? "Saved ✓" : "Save token"}</button>

                            <div className="card-header"><span className="card-title">Session</span></div>

                                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>

                                    <code style={{ fontSize: 11, color: "var(--text3)" }}>{SESSION_ID}</code>
                                </div>
                                <button className="btn btn-red btn-sm" onClick={() => {
                                    localStorage.removeItem("dd_session");
                                    window.location.reload();
                                }}>New session</button>
                            </div>
                        </div>

                        <div className="card" style={{ marginTop: 10 }}>
                            <div className="card-header"><span className="card-title">About</span></div>
                            <div style={{ fontSize: 12, color: "var(--text2)", lineHeight: 1.6 }}>
                                <div><strong>DefinitionDrift</strong> v2.0.0</div>
                                <div style={{ marginTop: 4 }}>Talk-to-Data agent with HITL definition governance.</div>
                                <div style={{ marginTop: 4 }}>Built with FastAPI · LangGraph · MCP · SQLite</div>
                                <div style={{ marginTop: 8 }}>
                                    <a href="/api/docs" target="_blank" className="btn btn-ghost btn-sm">API Docs ↗</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ── APP ───────────────────────────────────────────────────────────
        function App() {
            const [tab, setTab] = useState("chat");
            const [wsConn, setWsConn] = useState(false);
            const [refreshKey, setRefreshKey] = useState(0);
            const [queueCount, setQueueCount] = useState(0);
            const [driftCount, setDriftCount] = useState(0);

            // WebSocket
            useEffect(() => {
                const proto = window.location.protocol === "https:" ? "wss" : "ws";
                const ws = new WebSocket(`${proto}://${window.location.host}/ws`);
                ws.onopen = () => setWsConn(true);
                ws.onclose = () => setWsConn(false);
                ws.onmessage = e => {
                    try {
                        const d = JSON.parse(e.data);
                        if (d.event === "conflict_resolved" || d.event === "definition_updated") {
                            setRefreshKey(p => p + 1);
                        }
                        if (d.event === "drift_detected") {
                            setDriftCount(d.count || 1);
                            toast(`⚠️ Schema drift: ${d.count} event(s)`, "yellow");
                        }
                    } catch (_) { }
                };
                const ping = setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 25000);
                return () => { clearInterval(ping); ws.close(); };
            }, []);

            // Poll queue count
            useEffect(() => {
                async function pollQueue() {
                    try {
                        const d = await apiFetch("/api/hitl/queue");
                        setQueueCount(d.pending_count || 0);
                        const dr = await apiFetch("/api/drift");
                        setDriftCount((dr.events || []).length);
                    } catch (_) { }
                }
                pollQueue();
                const t = setInterval(pollQueue, 15000);
                return () => clearInterval(t);
            }, [refreshKey]);

            const NAV = [
                { id: "chat", icon: "💬", label: "Chat" },
                { id: "defs", icon: "📋", label: "Definitions" },
                { id: "hitl", icon: "⚠️", label: "HITL Queue", badge: queueCount || null, badgeColor: "" },
                { id: "drift", icon: "🔍", label: "Drift", badge: driftCount || null, badgeColor: "yellow" },
                { id: "history", icon: "📜", label: "History" },
                { id: "stats", icon: "📊", label: "Stats" },
                { id: "settings", icon: "⚙️", label: "Settings" },
            ];

            function renderPanel() {
                const k = refreshKey;
                switch (tab) {
                    case "chat": return <ChatPanel wsConn={wsConn} onStatsChange={() => setRefreshKey(p => p + 1)} />;
                    case "defs": return <DefinitionsPanel refreshKey={k} />;
                    case "hitl": return <HitlPanel refreshKey={k} onResolved={() => { setRefreshKey(p => p + 1); setQueueCount(p => Math.max(0, p - 1)) }} />;
                    case "drift": return <DriftPanel refreshKey={k} />;
                    case "history": return <HistoryPanel refreshKey={k} />;
                    case "stats": return <StatsPanel refreshKey={k} />;
                    case "settings": return <SettingsPanel />;
                    default: return null;
                }
            }

            const activeNav = NAV.find(n => n.id === tab);

            return (
                <div className="app">
                    {/* Sidebar */}
                    <div className="sidebar">
                        <div className="logo">
                            <div className="logo-icon">⬡</div>
                            <div className="logo-text">
                                <h1>DefinitionDrift</h1>
                                <span>Talk-to-Data</span>
                            </div>
                        </div>
                        <nav className="nav">
                            {NAV.map(n => (
                                <div key={n.id} className={`nav-item ${tab === n.id ? "active" : ""}`}
                                    onClick={() => setTab(n.id)}>
                                    <span className="ni">{n.icon}</span>
                                    <span>{n.label}</span>
                                    {n.badge ? <span className={`nav-badge ${n.badgeColor || ""}`}>{n.badge}</span> : null}
                                </div>
                            ))}
                        </nav>
                        <div className="sidebar-footer">
                            <div className={`ws-dot ${wsConn ? "pulse" : "off"}`} />
                            <span>{wsConn ? "Live" : "Offline"}</span>
                            <span style={{ marginLeft: "auto", fontSize: 10 }}>v2.0</span>
                        </div>
                    </div>

                    {/* Main content */}
                    <div className="main">
                        {/* Top bar */}
                        <div className="topbar">
                            <div className="topbar-title">
                                {activeNav?.icon} {activeNav?.label}
                            </div>
                            <div className="topbar-sub">
                                {tab === "chat" && "Contoso Retail · Governed NL-to-SQL"}
                                {tab === "defs" && "Versioned metric definitions"}
                                {tab === "hitl" && "Human-in-the-loop conflict resolution"}
                                {tab === "drift" && "Schema change detection"}
                                {tab === "history" && "Past queries and results"}
                                {tab === "stats" && "Usage and performance metrics"}
                            </div>
                            <div className="topbar-right">
                                {queueCount > 0 && tab !== "hitl" && (
                                    <button className="btn btn-yellow btn-sm" onClick={() => setTab("hitl")}>
                                        ⚠️ {queueCount} conflict{queueCount !== 1 ? "s" : ""}
                                    </button>
                                )}
                                <a href="/api/docs" target="_blank" className="btn btn-ghost btn-sm">API Docs</a>
                            </div>
                        </div>

                        {/* Panel */}
                        <div className="content">
                            {renderPanel()}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(
            <React.StrictMode>
                <ToastHost />
                <App />
            </React.StrictMode>
        );
    </script>
</body>

</html>
