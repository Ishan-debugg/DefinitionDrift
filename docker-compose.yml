# DefinitionDrift — docker-compose
# One command to run the full stack: docker-compose up
# Zero purchase: no paid services required
#
# Database options (set DATA_DB_URL in environment or .env):
#   SQLite  (default) — no extra service needed
#   Postgres          — uncomment the 'db' service below and set DATA_DB_URL
#   MySQL             — replace 'db' image with mysql:8 and adjust DATA_DB_URL

version: "3.9"

services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./definitiondrift.db:/app/definitiondrift.db
      - ./embeddings/cache.db:/app/embeddings/cache.db
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # SQLite (default — no extra service needed)
      - DATA_DB_URL=sqlite:////app/data/contoso.db
      # Postgres example (uncomment + uncomment 'db' service below):
      # - DATA_DB_URL=postgresql+psycopg2://dd:dd_pass@db:5432/contoso
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # depends_on:
    #   db:
    #     condition: service_healthy

  mcp:
    build: .
    command: python mcp_server/server.py
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_DB_URL=sqlite:////app/data/contoso.db
    volumes:
      - ./data:/app/data
      - ./definitiondrift.db:/app/definitiondrift.db
    restart: unless-stopped
    depends_on:
      - api

  # ── Optional Postgres service ───────────────────────────────────────
  # Uncomment and set DATA_DB_URL=postgresql+psycopg2://dd:dd_pass@db:5432/contoso
