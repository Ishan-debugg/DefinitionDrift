# DefinitionDrift — docker-compose
# One command to run the full stack: docker-compose up
# Zero purchase: no paid services, no cloud DBs

version: "3.9"

services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./definitiondrift.db:/app/definitiondrift.db
      - ./embeddings/cache.db:/app/embeddings/cache.db
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_DB_PATH=/app/data/contoso.db
      - ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build: .
    command: python mcp_server/server.py
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_DB_PATH=/app/data/contoso.db
    volumes:
      - ./data:/app/data
      - ./definitiondrift.db:/app/definitiondrift.db
    restart: unless-stopped
    depends_on:
      - api